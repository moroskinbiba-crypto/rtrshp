name: Schema and import checks

on:
  push:
    branches: [main]
  pull_request:

jobs:
  library-schema:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check personal library and catalogue schema invariants
        run: node scripts/check_library_schema.mjs

  import-source-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile import source validator
        run: cc -std=c11 -Wall -Wextra -Werror -pedantic src/library/import_source.c tests/test_import_source.c -o /tmp/test_import_source
      - name: Run import source tests
        run: /tmp/test_import_source
